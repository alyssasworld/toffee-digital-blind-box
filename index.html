<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b82e8" />
    <title>Toffee Blind Box 🐈‍⬛</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/toffee-icon-48.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/pixelify-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Start downloading the 3D model and the first button right away, in parallel with the JavaScript,
         instead of waiting for the JavaScript to run and ask for them. -->
    <link rel="preload" href="/models/toffee_box.glb" as="fetch" crossorigin />
    <link rel="preload" href="/buttons/open_button.png" as="image" />
    <link rel="preload" href="/background/sky-pixel-bg.png" as="image" />
    <style>
      /* Critical styles: this loading screen is shown the moment the page arrives, before any
         JavaScript runs, and React reuses the same .boot markup while the 3D box loads. */
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('/fonts/pixelify-sans-latin.woff2') format('woff2');
        font-weight: 400 700;
        font-display: block;
      }
      html, body { margin: 0; height: 100%; background: #0b82e8; }
      .boot {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;
        background: #0b82e8; color: #fbf4dc;
        font-family: 'Pixelify Sans', ui-rounded, system-ui, sans-serif;
        text-align: center; transition: opacity 0.35s ease;
      }
      .boot--done { opacity: 0; pointer-events: none; }
      .boot-title { font-size: clamp(2.4rem, 12vw, 3.6rem); font-weight: 700; line-height: 1; margin: 0; text-shadow: 0.06em 0.08em 0 #2a2f5c; }
      .boot-note { font-size: 1.15rem; letter-spacing: 0.06em; margin: 0; text-shadow: 0.08em 0.1em 0 #2a2f5c; }
      .boot-dots { display: inline-flex; gap: 0.35rem; margin-left: 0.5rem; }
      .boot-dots i { width: 0.45rem; height: 0.45rem; background: #fbf4dc; box-shadow: 0.1rem 0.1rem 0 #2a2f5c; opacity: 0.35; animation: boot-dot 1.2s steps(1) infinite; }
      .boot-dots i:nth-child(2) { animation-delay: 0.3s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.6s; }
      @keyframes boot-dot { 0% { opacity: 1; } 25%, 100% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .boot-dots i { animation: none; opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <h1 class="boot-title">Open Me!</h1>
        <p class="boot-note">Loading<span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
      </div>
    </div>
    <noscript>
      <div class="boot"><p class="boot-note">This blind box needs JavaScript. Please turn it on and reload.</p></div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
